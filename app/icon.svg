<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Us &amp; The World — a cyan pin against a starfield"
>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#11214A" />
      <stop offset="100%" stop-color="#03071A" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#5BC0E8" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#5BC0E8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#5BC0E8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pinFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BE0F6" />
      <stop offset="55%" stop-color="#5BC0E8" />
      <stop offset="100%" stop-color="#3FA8D6" />
    </linearGradient>
    <radialGradient id="pinGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5BC0E8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#5BC0E8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background. PWA maskable safe zone is the inner 80%
       radius — every drawn element below stays well within that. -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Starfield. Positioned in the corners so the central pin reads
       cleanly. Sizes vary so the strip doesn't look mechanical. -->
  <g fill="#FFFFFF">
    <circle cx="64"  cy="80"  r="2.5" opacity="0.85" />
    <circle cx="128" cy="48"  r="1.5" opacity="0.55" />
    <circle cx="208" cy="96"  r="1.2" opacity="0.40" />
    <circle cx="320" cy="64"  r="2"   opacity="0.70" />
    <circle cx="416" cy="128" r="2.8" opacity="0.90" />
    <circle cx="448" cy="56"  r="1.4" opacity="0.50" />
    <circle cx="60"  cy="208" r="1.6" opacity="0.55" />
    <circle cx="68"  cy="424" r="2.2" opacity="0.80" />
    <circle cx="124" cy="468" r="1.4" opacity="0.50" />
    <circle cx="248" cy="456" r="1.2" opacity="0.40" />
    <circle cx="368" cy="432" r="1.8" opacity="0.60" />
    <circle cx="452" cy="368" r="2.4" opacity="0.85" />
    <circle cx="464" cy="284" r="1.3" opacity="0.45" />
  </g>

  <!-- Cyan glow centered behind the pin so the whole composition
       reads like an "atmospheric pinpoint from orbit." -->
  <circle cx="256" cy="248" r="220" fill="url(#halo)" />

  <!-- The pin. Bulb radius 96, center at (256, 200), tip at y=420.
       Total height ~316 px = 62% of the canvas. All within the
       maskable safe radius from the canvas center. -->
  <g>
    <!-- Soft outer glow behind the teardrop. -->
    <ellipse cx="256" cy="220" rx="128" ry="160" fill="url(#pinGlow)" />

    <!-- Teardrop body. -->
    <path
      d="M256 420
         C 256 420, 152 296, 152 200
         C 152 142, 198 96, 256 96
         C 314 96, 360 142, 360 200
         C 360 296, 256 420, 256 420 Z"
      fill="url(#pinFill)"
    />

    <!-- Subtle highlight on the upper-left of the bulb. -->
    <path
      d="M214 144
         C 226 124, 246 112, 264 110"
      stroke="#FFFFFF"
      stroke-opacity="0.55"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Inner dot — punched out so the pin reads as a marker. -->
    <circle cx="256" cy="196" r="36" fill="#03071A" />
    <circle cx="256" cy="196" r="14" fill="#5BC0E8" opacity="0.85" />
  </g>
</svg>
